name: weekly

# Starts the build workflow on main once a week, for a new Go release: every build takes the
# newest stable Go, but nothing else starts one when only Go changes (Dependabot watches
# go.mod, not Go). The Go version is part of the package fingerprint
# (scripts/package-fingerprint.sh), so the build publishes a new revision only then; in other
# weeks it publishes nothing.
#
# A workflow of its own because GitHub disables a scheduled workflow after 60 days without
# repository activity, and with it all its other triggers; here that stops only this weekly
# start, not the build with Dependabot's updates. Re-enable with
#   gh workflow enable weekly.yml --repo MarcFauser/caddy-deb
on:
  schedule:
    # Friday 04:37 UTC. Go released on Tuesday, Wednesday, Thursday and Monday since 2025
    # (go.dev/doc/devel/release, 54 releases), so Friday morning catches the week. Not on the
    # hour: GitHub delays scheduled runs then, and may drop some.
    - cron: '37 4 * * 5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  start-build:
    name: start the build on main
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: start the build workflow
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # A run started with GITHUB_TOKEN through workflow_dispatch does start (GitHub docs,
          # "Triggering a workflow from a workflow"); the merge job in build.yml relies on it too.
          gh workflow run build.yml --ref main
          echo "started build.yml on main"
