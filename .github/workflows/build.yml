name: build

# Pull requests (also Dependabot's): build and test. Dependabot's pull requests are merged
# when the tests pass. Pushes to main and manual runs (also the weekly one from weekly.yml):
# build, test, publish to GitHub Pages and check the published repository. A new package
# revision is published only when the package itself changed (scripts/choose-package.sh);
# otherwise the published package stays and the servers have nothing to install. The
# repository also offers earlier versions from the GitHub releases (KEEP_VERSIONS in total,
# scripts/fetch-older.sh) for going back. Every release also carries the Windows build as a
# zip, which windows/Update-Caddy.ps1 installs on Windows servers. Once the repository
# variables for Azure Artifact Signing are set (README, "Code signing"), publishing runs sign
# caddy.exe and Update-Caddy.ps1 before they are tested and released.
#
# Jobs after one that may be skipped (sign-windows) name the results they need: with GitHub's
# implicit success(), a skipped job also skips the jobs after it.
on:
  push:
    branches: [main]
    # A push that changes only these files runs nothing at all.
    # (GitHub: the workflow is skipped only when all changed paths match.)
    paths-ignore:
      - README.md
      - HISTORY.md
      - CHANGELOG.md
      - LICENSE
  pull_request:
    branches: [main]
  # No schedule here: GitHub disables a scheduled workflow after 60 days without repository
  # activity, and with it every other trigger of that workflow. weekly.yml starts this one.
  workflow_dispatch:
    inputs:
      new_revision:
        description: Publish a new package revision even if the package did not change
        type: boolean
        default: false

permissions:
  contents: read

env:
  PAGES_URL: https://marcfauser.github.io/caddy-deb
  # versions the repository offers: the current package and the highest earlier ones
  KEEP_VERSIONS: 5
  # caddyserver/dist: systemd units, Caddyfile, welcome page and maintainer scripts
  # (Apache-2.0), the same files Caddy's own package contains
  DIST_REF: f94a1d2626835ff4157e85296fb8e4fa5500e0fb
  NFPM_VERSION: v2.48.0
  # Windows build: Caddy's icon from xcaddy v0.4.7 (internal/utils/resources/ico/caddy.ico,
  # Apache-2.0) and goversioninfo as xcaddy v0.4.7 uses it (go.mod), see scripts/build.sh
  XCADDY_REF: e0e8f68a0f4bef11bfd04c4fb3091052ad36132f
  CADDY_ICO_SHA256: 63fd9064c4bf5bae0935105c909129862d24ac8038436f052af697c16b9027ea
  GOVERSIONINFO_VERSION: v1.7.0

jobs:
  build:
    name: build the package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
      - name: install nfpm
        run: go install "github.com/goreleaser/nfpm/v2/cmd/nfpm@${NFPM_VERSION}"
      - name: build
        env:
          PKG_RELEASE: ${{ github.run_number }}
        run: bash scripts/build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: deb
          path: out/
          if-no-files-found: error

  test:
    name: install on ${{ matrix.image }}
    needs: build
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: ['debian:12', 'debian:13', 'ubuntu:24.04']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: deb
          path: out
      - run: bash tests/install-test.sh out/*.deb

  test-systemd:
    # Directly on the runner VM: systemd runs there, so Caddy really runs. The VM is thrown
    # away after the job.
    name: install with systemd (runner VM)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: deb
          path: out
      - run: sudo bash tests/install-test.sh out/*.deb

  sign-windows:
    # Azure Artifact Signing, in publishing runs and only once ARTIFACT_SIGNING_PROFILE is set.
    # The login is OpenID Connect: Azure trusts a token for the environment code-signing,
    # which only main may use (README, "Code signing"); there is no secret to leak. Pull
    # requests, Dependabot's included, never get here.
    name: sign the Windows build
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.ARTIFACT_SIGNING_PROFILE != ''
    runs-on: windows-2025
    timeout-minutes: 20
    environment: code-signing
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: deb
          path: out
      - id: unpack
        name: unpack the Windows zip
        shell: pwsh
        run: |
          $zips = @(Get-ChildItem -LiteralPath out -File | Where-Object { $_.Name -match '^caddy_.+_windows_amd64\.zip$' })
          if ($zips.Count -ne 1) { throw "expected one Windows zip in out, found $($zips.Count)" }
          Expand-Archive -LiteralPath $zips[0].FullName -DestinationPath windows-sign
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8NoBOM -Value "folder=$((Resolve-Path -LiteralPath windows-sign).ProviderPath)", "zip=$($zips[0].Name)"
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files: |
            ${{ steps.unpack.outputs.folder }}\caddy.exe
            ${{ steps.unpack.outputs.folder }}\Update-Caddy.ps1
          file-digest: SHA256
          # Artifact Signing certificates are valid for 72 hours; the timestamp keeps the
          # signature valid after that (README of the action, "Timestamping")
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Caddy with plugins, built by github.com/MarcFauser/caddy-deb
          description-url: https://github.com/MarcFauser/caddy-deb
          # only the Azure CLI login of azure/login above (docs/OIDC.md of the action)
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
      - name: check the signatures and pack the zip again
        shell: pwsh
        env:
          FOLDER: ${{ steps.unpack.outputs.folder }}
          ZIP_NAME: ${{ steps.unpack.outputs.zip }}
        run: ./scripts/pack-signed-windows.ps1 -Folder $env:FOLDER -ZipName $env:ZIP_NAME -Destination signed
      - uses: actions/upload-artifact@v7
        with:
          name: windows-signed
          path: signed/
          if-no-files-found: error

  test-windows:
    # The Windows zip and Update-Caddy.ps1 against a real Windows service; the runner VM runs
    # as administrator and is thrown away after the job. The signed zip if there is one.
    name: Windows build and update script
    needs: [build, sign-windows]
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.sign-windows.result == 'success' || needs.sign-windows.result == 'skipped') }}
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: deb
          path: out
      - uses: actions/download-artifact@v8
        if: needs.sign-windows.result == 'success'
        with:
          name: windows-signed
          path: signed
      - name: take the signed zip
        if: needs.sign-windows.result == 'success'
        shell: pwsh
        run: Copy-Item -Path signed\*_windows_amd64.zip -Destination out -Force
      - name: test
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # a publishing run: an unsigned build must not go out with a script that pins a signer
          PUBLISHING: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        run: ./tests/windows-test.ps1 -OutDir out -Publishing:($env:PUBLISHING -eq 'true')

  merge:
    name: merge the Dependabot update
    needs: [test, test-systemd, test-windows]
    if: ${{ !cancelled() && needs.test.result == 'success' && needs.test-systemd.result == 'success' && needs.test-windows.result == 'success' && github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: merge, then start the publishing run on main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr merge --squash --delete-branch "$PR_URL"
          # A push made with GITHUB_TOKEN starts no workflow run; workflow_dispatch does
          # (GitHub docs, "Triggering a workflow from a workflow").
          gh workflow run build.yml --ref main

  publish:
    name: publish to GitHub Pages
    needs: [build, sign-windows, test, test-systemd, test-windows]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.build.result == 'success' && (needs.sign-windows.result == 'success' || needs.sign-windows.result == 'skipped') && needs.test.result == 'success' && needs.test-systemd.result == 'success' && needs.test-windows.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: publish
      cancel-in-progress: false
    outputs:
      page_url: ${{ steps.deploy.outputs.page_url }}
      version: ${{ steps.version.outputs.version }}
      reused: ${{ steps.choose.outputs.reused }}
      offered: ${{ steps.offered.outputs.offered }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: deb
          path: out
      - uses: actions/download-artifact@v8
        if: needs.sign-windows.result == 'success'
        with:
          name: windows-signed
          path: signed
      - name: take the signed zip
        if: needs.sign-windows.result == 'success'
        run: |
          signed=(signed/*_windows_amd64.zip)
          if [ "${#signed[@]}" -ne 1 ] || [ ! -f "${signed[0]}" ] || [ ! -f "out/$(basename "${signed[0]}")" ]
          then
              echo "FAIL: expected one signed zip with the name of the zip in out/: ${signed[*]}" >&2
              exit 1
          fi
          cp "${signed[0]}" out/
      - id: choose
        name: keep the published package if it did not change
        env:
          FORCE: ${{ inputs.new_revision }}
        run: bash scripts/choose-package.sh
      - id: version
        run: echo "version=$(cat out/version.txt)" >> "$GITHUB_OUTPUT"
      - name: fetch the earlier versions from the GitHub releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/fetch-older.sh
      - name: import the signing key
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          if [ -z "$APT_SIGNING_KEY" ]
          then
              echo "FAIL: the repository secret APT_SIGNING_KEY is missing, see README" >&2
              exit 1
          fi
          printf '%s\n' "$APT_SIGNING_KEY" | gpg --batch --import
      - name: build the repository
        run: |
          command -v apt-ftparchive >/dev/null || sudo apt-get install -y -q apt-utils
          bash scripts/publish.sh
      - id: offered
        run: echo "offered=$(paste -sd ' ' out/offered-versions.txt)" >> "$GITHUB_OUTPUT"
      # One artifact name per attempt: a re-run keeps the artifact of the earlier attempt in the
      # run, and deploy-pages refuses two of the same name ("Multiple artifacts named
      # github-pages", build #14 on 2026-11-07). Both steps are in this job, so they always see
      # the same attempt.
      - uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_attempt }}
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: GitHub release with the package
        # a kept package already has its release
        if: steps.choose.outputs.reused == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # a re-run of the same run has the same version: replace the files then
          if gh release view "v$VERSION" >/dev/null 2>&1
          then
              gh release upload "v$VERSION" out/*.deb out/*_windows_amd64.zip --clobber
          else
              gh release create "v$VERSION" out/*.deb out/*_windows_amd64.zip --target "$GITHUB_SHA" \
                  --title "caddy $VERSION" \
                  --notes "caddy $VERSION (amd64), built by run ${{ github.run_number }} from $GITHUB_SHA."
          fi

  verify:
    name: install from the published repository
    needs: publish
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-24.04
    container: debian:13
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: bash tests/repo-test.sh "${{ needs.publish.outputs.page_url }}" "${{ needs.publish.outputs.version }}" "${{ needs.publish.outputs.offered }}"

  verify-windows:
    # Update-Caddy.ps1 installs the new release from GitHub. A kept package has no new
    # release, and its release may predate the Windows build.
    name: install the release on Windows
    needs: publish
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.publish.outputs.reused == 'false' }}
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: test
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./tests/windows-test.ps1 -PublishedVersion "${{ needs.publish.outputs.version }}"
